name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check design tokens are generated
        run: python3 design/generate.py --check
      - name: Test Home Assistant integration
        run: |
          pip install pytest-homeassistant-custom-component
          python -m pytest -c ha_tests/pytest.ini ha_tests -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Use custom signing key (optional)
        env:
          SIGNING_STORE_B64: ${{ secrets.SIGNING_STORE_B64 }}
        if: env.SIGNING_STORE_B64 != ''
        run: |
          echo "$SIGNING_STORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PurpleTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PurpleTV
          path: PurpleTV.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PurpleTV 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            Automatischer Build von `${{ github.ref_name }}` (${{ github.sha }}).
            Direktlink für den TV: https://github.com/${{ github.repository }}/releases/latest/download/PurpleTV.apk
          files: PurpleTV.apk
