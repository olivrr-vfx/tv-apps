name: Diagnose on emulator

# Installs the release APK on an Android emulator, opens every screen, calls the
# local API and saves screenshots, API answers and logcat to the `diagnostics` branch.
# Only on demand (Actions → Diagnose → Run workflow); it takes about 15 minutes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
          YOUTUBE_CLIENT_ID: ${{ vars.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          COUCH_NO_UPDATES: "1"
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log || {
            grep -E "^e: |error:|FAILED" build.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk Couch.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/diagnose.sh

      - name: Save results to the diagnostics branch
        if: always()
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: bash .github/scripts/save-diag.sh
